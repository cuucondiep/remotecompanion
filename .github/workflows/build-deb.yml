name: Build DEB Package

on:
  push:
    branches:
      - build/roothide
    paths:
      - 'Tweak/**'
      - 'debian/**'
      - '.github/workflows/build-deb.yml'
  pull_request:
    branches:
      - build/roothide
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: build/roothide

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            fakeroot \
            devscripts \
            equivs

      - name: Check Tweak Makefile
        run: |
          if [ ! -f "Tweak/Makefile" ]; then
            echo "ERROR: Tweak/Makefile not found"
            exit 1
          fi
          echo "✓ Tweak/Makefile found"

      - name: Extract version from debian/changelog
        id: version
        run: |
          VERSION=$(head -n 1 debian/changelog | grep -oP '\(\K[^)]+')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Package Version: ${VERSION}"

      - name: Build DEB package
        run: |
          cd ${{ github.workspace }}
          dpkg-buildpackage -us -uc -b 2>&1 | tee build.log

      - name: List built packages
        run: |
          ls -lah ../*.deb || echo "No DEB files found"

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: deb-package-${{ steps.version.outputs.version }}
          path: |
            ../*.deb
            ../*.changes
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ../*.deb
            ../*.changes
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Package Version: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [ -f build.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Build Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 20 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
